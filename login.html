<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – EDUConnect</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="edu-home-page d-flex flex-column min-vh-100">

  <!-- Header (Deep Maroon Theme) -->
  <header class="home-navbar py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="home-brand d-flex align-items-center gap-1" href="index.html">EDU<span class="brand-gold">Connect</span></a>
      <a href="index.html" class="home-nav-link">
        <i class="bi bi-arrow-left me-1"></i> Back to Homepage
      </a>
    </div>
  </header>

  <!-- Login Main Container -->
  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-7 col-xl-5">

        <!-- Login Card -->
        <div class="edu-card p-4 p-md-5 shadow-sm">
          <div class="text-center mb-4">
            <div class="club-circle-avatar mx-auto mb-3" style="width: 64px; height: 64px; font-size: 1.8rem;">
              <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h2 class="home-section-title mb-1" style="font-size: 2rem;">Sign In to EduConnect</h2>
            <p class="text-muted small">Enter your official East Delta University email and password to access the portal.</p>
          </div>

          <!-- Alert message box -->
          <div id="login-alert" class="alert d-none" role="alert"></div>

          <!-- Login Form -->
          <form id="login-form">
            <div class="mb-3">
              <label for="login-email" class="form-label small fw-semibold">University Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control border-start-0 ps-0" id="login-email" placeholder="e.g. raida.sarwar@student.edu or admin@edu.ac.bd" required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="login-password" class="form-label small fw-semibold mb-0">Password</label>
                <a href="#" class="small text-muted text-decoration-none" onclick="showToast('Please contact the EDU IT Helpdesk (it-support@edu.ac.bd) to reset your student portal password.', 'info'); return false;">Forgot?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" id="login-password" placeholder="Enter your portal password" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="login-role" class="form-label small fw-semibold">Account Role</label>
              <select class="form-select" id="login-role">
                <option value="student" selected>Student</option>
                <option value="club_rep">Club Representative</option>
                <option value="admin">Administrator / Faculty</option>
              </select>
            </div>

            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-hero-explore py-2 text-center justify-content-center">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
              </button>
            </div>
          </form>

          <div class="text-center pt-3 border-top">
            <p class="small text-muted mb-0">
              New to EduConnect? <a href="register.html" class="fw-bold text-decoration-none" style="color: #58101e;">Create an Account</a>
            </p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Clean Footer -->
  <footer class="home-footer mt-auto">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div class="home-footer-left">EduConnect &middot; East Delta University</div>
      <div class="home-footer-right">Together We Grow</div>
    </div>
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Application Scripts -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
